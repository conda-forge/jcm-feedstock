{% set version = "2.0.1" %}
{% set python_min = "3.11.0" %} 

package:
  name: jcm
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/j/jcm/jcm-{{ version }}.tar.gz
  sha256: 2545511d86e20285fbffe3cb07c13d66f7979ba98f3b78c68c0ac2b5abea14b4

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=40.4
    - setuptools-scm
    - pip
  run:
    - python >={{ python_min }}
    - dinosaur-dycore
    - flax >=0.12.0
    - jax-datetime
    - tree-math
    - hydra-core
    - xarray
    - pytest-cov
    - pytest-xdist
    - sphinx
    - furo
    - myst-parser
    - jax-solar
    - jax-rrtmgp >=0.2.0

test:
  imports:
    - jcm
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://pypi.org/project/jcm/
  summary: JAX-based General Circulation Model
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - mahf708
