{% set version = "3.0.0" %}
{% set python_min = "3.11.0" %} 

package:
  name: jcm
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/j/jcm/jcm-{{ version }}.tar.gz
  sha256: 0f132771017c57eb55a732f8aba776000d2e0881ac4bf02aa1476e7d8fbe5d71

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=40.4
    - setuptools-scm
    - pip
  run:
    - python >={{ python_min }}
    - dinosaur-dycore
    - flax >=0.12.0
    - jax-datetime
    - tree-math
    - hydra-core
    - xarray
    - pytest-cov
    - pytest-xdist
    - sphinx
    - furo
    - myst-parser
    - jax-solar
    - jax-rrtmgp >=0.2.0

test:
  imports:
    - jcm
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/climate-analytics-lab/jax-gcm
  summary: JAX-based General Circulation Model
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - mahf708
